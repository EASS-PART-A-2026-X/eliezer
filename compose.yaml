# compose.yaml (Compose Specification: no top-level "version:" key)
name: eliezer

services:
  db:
    # Infrastructure, not one of the three application services.
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: eliezer
      POSTGRES_DB: eliezer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eliezer-dev} # set your own in .env
    volumes:
      - db-data:/var/lib/postgresql # v18 layout; survives "down", "down -v" deletes it
    # No host port: only the backend (on the Compose network) reaches the database.
    # The entrypoint starts as root and switches to the postgres user, so the
    # capability set stays default; no-new-privileges still applies.
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # Over TCP: a socket-only probe passes while the init server is still running.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U eliezer -d eliezer"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  ollama:
    # Infrastructure: runs the real model on this machine's CPU. On the first start
    # it downloads the model named in AI_MODEL (gemma4:e2b is 4.6 GB) in the
    # background; later starts find it in the volume. Nothing waits for the
    # download: the garden works at once, and photo identification answers
    # "AI unavailable" until it is done. With AI_MODEL=test (demo mode) it stays idle.
    build: ./ollama # the official Ollama release without its GPU libraries
    volumes:
      - ollama-models:/models # downloaded models survive "down"; "down -v" deletes them
    environment:
      AI_MODEL: ${AI_MODEL:-ollama:gemma4:e2b} # which model to download
      # CPU threads for the model: 4 is ~10x faster than one per CPU on a busy
      # laptop (see ollama/entrypoint.sh). Try more on a machine with many free cores.
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-4}
      OLLAMA_NUM_PARALLEL: "1" # one request at a time keeps memory use down
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 30m # stay loaded between photos; loading takes ~20 s
    ports:
      # Loopback only: lets the evaluation (and `ollama` commands) on this machine
      # reach it; nothing else on your network can. 11435, not Ollama's usual 11434,
      # so it does not clash with an Ollama installed on the host.
      - "127.0.0.1:${OLLAMA_PORT:-11435}:11434"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ai-service:
    build: ./ai-service
    # No host port: reachable on the Compose network, not published at localhost:8001.
    env_file:
      - path: .env # your real settings and keys (git-ignored)
        required: false # a clean checkout has no .env and still starts
    environment:
      # The real model by default; AI_MODEL=test in .env = demo mode (fixed answers,
      # no download, no key, no cost).
      AI_MODEL: ${AI_MODEL:-ollama:gemma4:e2b}
      # The ollama service above; for Ollama installed on the host instead, set
      # OLLAMA_BASE_URL=http://host.docker.internal:11434/v1 in .env.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      PYDANTIC_AI_NO_BANNER: "1"
    extra_hosts:
      # Lets the container reach Ollama running on the host, on Linux too.
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama:
        condition: service_started # order only: the garden must not wait for the AI
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      # Slim images have no curl, so ask Python's standard library instead.
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://localhost:8001/health", timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000" # host IP:host port:container port
    environment:
      DATABASE_URL: postgresql+psycopg://eliezer:${POSTGRES_PASSWORD:-eliezer-dev}@db:5432/eliezer
      AI_SERVICE_URL: http://ai-service:8001 # the service name is a DNS name
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://localhost:8000/health", timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8501}:8501"
    environment:
      BACKEND_URL: http://backend:8000 # Streamlit calls the API server-side
    depends_on:
      backend:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://localhost:8501/_stcore/health", timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  db-data:
  ollama-models:
