[project]
name = "eliezer-ai-service"
version = "0.1.0"
description = "Independent FastAPI + Pydantic AI service; never touches the database"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]==0.143.3",
    "pydantic-ai-slim[openai]==2.57.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "pydantic-evals>=2.57.0",
    "pytest==9.1.1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.fastapi]
entrypoint = "app.main:app"
