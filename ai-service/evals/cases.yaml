# Plant identification cases. inputs = a file in evals/images (see ATTRIBUTION.md).
# metadata.names: accepted scientific names (synonyms count); a one-word name
# means "the genus is enough". is_plant: false is the control-flow case.
name: plant_identification
cases:
  - name: rosemary
    inputs: rosemary.jpg
    metadata: {slice: herb, is_plant: true, names: [Salvia rosmarinus, Rosmarinus officinalis]}

  - name: basil
    inputs: basil.jpg
    metadata: {slice: herb, is_plant: true, names: [Ocimum basilicum]}

  - name: lemon_illustration
    inputs: lemon.jpg
    metadata: {slice: illustration, is_plant: true, names: [Citrus × limon]}

  - name: olive_tree
    inputs: olive.jpg
    metadata: {slice: tree, is_plant: true, names: [Olea europaea]}

  - name: bougainvillea
    inputs: bougainvillea.jpg
    metadata: {slice: ornamental, is_plant: true, names: [Bougainvillea]}

  - name: aloe_vera
    inputs: aloe_vera.jpg
    metadata: {slice: succulent, is_plant: true, names: [Aloe vera, Aloe barbadensis]}

  - name: fig
    inputs: fig.jpg
    metadata: {slice: tree, is_plant: true, names: [Ficus carica]}

  - name: pothos
    inputs: pothos.jpg
    metadata: {slice: houseplant, is_plant: true, names: [Epipremnum aureum]}

  - name: sunflower
    inputs: sunflower.jpg
    metadata: {slice: ornamental, is_plant: true, names: [Helianthus annuus]}

  - name: not_a_plant
    inputs: bicycle.jpg
    metadata: {slice: control, is_plant: false, names: []}
